          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          # --no-deps: do not smash numpy/protobuf; CPU wheel must replace any CUDA torch from requirements.
          models/.venv/bin/pip install --force-reinstall --no-deps torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          models/.venv/bin/python -c 'import torch,numpy; print("torch", torch.__version__, "numpy", numpy.__version__)'
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Build + start bentoml, ray-serve, gateway, obs stack
        run: |
          docker compose build bentoml ray-serve gateway cost-exporter synthetic-dcgm
          docker compose up -d bentoml ray-serve gateway \
            otel-collector tempo prometheus alertmanager blackbox cost-exporter synthetic-dcgm grafana
      - name: Wait for gateway + prometheus
        run: |
          make wait-for-health WAIT_PORT=${{ env.VULCAN_GATEWAY_PORT }}
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}/-/ready" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "prometheus not ready" >&2
          exit 1
      - name: Observability smoke (targets + query + Tempo trace)
        run: |
          chmod +x observability/scripts/ci_smoke.sh
          PROM_URL="http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}" \
          GRAFANA_URL="http://127.0.0.1:${VULCAN_GRAFANA_PORT}" \
          GATEWAY_URL="http://127.0.0.1:${VULCAN_GATEWAY_PORT}" \
          TEMPO_URL="http://127.0.0.1:${VULCAN_TEMPO_PORT}" \
          bash observability/scripts/ci_smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v

