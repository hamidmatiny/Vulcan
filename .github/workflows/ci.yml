      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export pinned reference models (CPU)
        run: |
          python -m pip install -U pip
          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          models/.venv/bin/pip install --force-reinstall --no-deps torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Build + start bentoml, gateway, prometheus cost stack
        run: |
          docker compose build bentoml gateway cost-exporter synthetic-dcgm
          docker compose up -d bentoml gateway \
            alertmanager blackbox cost-exporter synthetic-dcgm prometheus
      - name: Wait for gateway + prometheus + cost series
        run: |
          make wait-for-health WAIT_PORT=${{ env.VULCAN_GATEWAY_PORT }}
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}/-/ready" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}/-/ready" >/dev/null
          for i in $(seq 1 45); do
            if curl -fsS --get "http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}/api/v1/query" \
              --data-urlencode "query=vulcan_estimated_cost_usd_per_token" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]["result"]'; then
              exit 0
            fi
            sleep 2
          done
          echo "cost-per-token series not ready" >&2
          exit 1
      - name: Install advisor deps
        run: |
          python -m pip install -U pip
          python -m venv advisor/.venv
          . advisor/.venv/bin/activate
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r advisor/requirements.txt
      - name: Offline unit tests + live non-fabrication graph
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: ${{ github.workspace }}
          VULCAN_ADVISOR_LIVE: "1"
          VULCAN_PROM_URL: http://127.0.0.1:9008
          VULCAN_GATEWAY_URL: http://127.0.0.1:9007
        run: |
          . advisor/.venv/bin/activate
          pytest -q advisor/tests
          python advisor/verify_live.py
      - name: Tear down
        if: always()
        run: docker compose down -v || true

