    needs: changes
    if: needs.changes.outputs.dvc_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
