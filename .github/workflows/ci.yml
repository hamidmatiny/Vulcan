  gateway:
    name: Gateway · conformance + k6 + fallback
    needs: changes
    if: needs.changes.outputs.gateway_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Go unit + fallback simulation tests
        run: make test-gateway
      - name: Export pinned reference models (CPU)
        run: |
          python -m pip install -U pip
          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          models/.venv/bin/pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Build + start bentoml, ray-serve, gateway (:9007)
        run: |
          docker compose build bentoml ray-serve gateway
          docker compose up -d bentoml ray-serve gateway
      - name: Wait for gateway /health
        run: make wait-for-health WAIT_PORT=${{ env.VULCAN_GATEWAY_PORT }}
      - name: Contract conformance suite (via gateway)
        run: |
          python -m venv serving/common/.venv
          . serving/common/.venv/bin/activate
          pip install -e "contracts/model-contract[dev]"
          pip install -e "serving/common[dev]"
          export VULCAN_BACKEND_URL="http://127.0.0.1:${VULCAN_GATEWAY_PORT}"
          cd serving/common
          pytest -q tests/conformance
      - name: Short CPU k6 against gateway
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -e BASE_URL="http://127.0.0.1:${VULCAN_GATEWAY_PORT}" \
            -e MODEL_TYPE=llm \
            -e MODEL_ID=reference-tiny-llm \
            -e VUS=2 \
            -e DURATION=10s \
            -e BACKEND_NAME=gateway \
            -e RESULTS_OUT=benchmark/results/gateway-cpu.json \
            grafana/k6:0.54.0 run benchmark/k6/infer.js
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark/results/gateway-cpu.json")
          data = json.loads(p.read_text())
          assert data["schema_version"] == 1
          assert data["backend"] == "gateway"
          assert data["metrics"]["requests_total"] > 0
          print("OK", p, data["metrics"])
          PY
      - name: Circuit-breaker fallback (stop selected backend)
        run: |
          chmod +x gateway/scripts/ci_fallback.sh
          GATEWAY_URL="http://127.0.0.1:${VULCAN_GATEWAY_PORT}" bash gateway/scripts/ci_fallback.sh
      - name: Upload gateway-cpu results
        uses: actions/upload-artifact@v4
        with:
          name: gateway-cpu-benchmark
          path: benchmark/results/gateway-cpu.json
      - name: Tear down
        if: always()
        run: docker compose down -v

  observability:
    name: Observability · scrape + dashboard query + trace smoke
    needs: changes
    if: needs.changes.outputs.observability_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export pinned reference models (CPU)
        run: |
          python -m pip install -U pip
          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          models/.venv/bin/pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Build + start bentoml, ray-serve, gateway, obs stack
        run: |
          docker compose build bentoml ray-serve gateway cost-exporter synthetic-dcgm
          docker compose up -d bentoml ray-serve gateway \
            otel-collector tempo prometheus alertmanager blackbox cost-exporter synthetic-dcgm grafana
      - name: Wait for gateway + prometheus
        run: |
          make wait-for-health WAIT_PORT=${{ env.VULCAN_GATEWAY_PORT }}
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}/-/ready" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "prometheus not ready" >&2
          exit 1
      - name: Observability smoke (targets + query + Tempo trace)
        run: |
          chmod +x observability/scripts/ci_smoke.sh
          PROM_URL="http://127.0.0.1:${VULCAN_PROMETHEUS_PORT}" \
          GRAFANA_URL="http://127.0.0.1:${VULCAN_GRAFANA_PORT}" \
          GATEWAY_URL="http://127.0.0.1:${VULCAN_GATEWAY_PORT}" \
          TEMPO_URL="http://127.0.0.1:${VULCAN_TEMPO_PORT}" \
          bash observability/scripts/ci_smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v

