          models/.venv/bin/pip install --force-reinstall --no-deps torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m venv models/.venv-dvc
          models/.venv-dvc/bin/pip install -r models/scripts/requirements-dvc.txt
          mkdir -p .dvc-remote
      - name: dvc repro + status clean + cross-validate sha256sums/MANIFEST
        env:
          PYTHONHASHSEED: "0"
        run: |
          models/.venv-dvc/bin/dvc repro
          status="$(models/.venv-dvc/bin/dvc status)"
          echo "$status"
          echo "$status" | grep -q 'Data and pipelines are up to date'
          # Lock must stay byte-stable under PYTHONHASHSEED=0 (phase-18 lesson).
          git diff --exit-code dvc.lock
          PYTHONPATH=models/scripts models/.venv-dvc/bin/python models/scripts/verify_dvc_manifest.py
          PYTHONPATH=models/scripts models/.venv/bin/python models/scripts/verify_manifest.py

  tracking:
    name: Experiment tracking · MLflow + W&B offline
    needs: changes
    if: needs.changes.outputs.tracking_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start self-hosted MLflow (:9014)
        run: |
          mkdir -p .mlflow
          docker compose --profile training build mlflow
          docker compose --profile training up -d mlflow
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${VULCAN_MLFLOW_PORT:-9014}/health" >/dev/null; then
              echo "MLflow healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile training logs mlflow || true
          exit 1
      - name: Install FSDP/DDP + tracking deps
        run: |
          python -m pip install -U pip
          python -m venv training/fsdp-ddp/.venv
          . training/fsdp-ddp/.venv/bin/activate
          pip install -r training/fsdp-ddp/requirements.txt
          pip install -r training/common/requirements-tracking.txt
          pip install -e "contracts/training-job-contract[dev]"
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: MLflow-backed FSDP/DDP run + API assert
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: ${{ github.workspace }}
          VULCAN_TRACKER_BACKEND: mlflow
          VULCAN_TRACKER_RUN_NAME: fsdp-ddp-cpu
          MLFLOW_TRACKING_URI: http://127.0.0.1:9014
        run: |
          . training/fsdp-ddp/.venv/bin/activate
          python training/fsdp-ddp/train.py --strategy ddp --output-dir training/results/fsdp-ddp-mlflow
          python training/common/verify_tracking.py --backend mlflow --tracking-uri "$MLFLOW_TRACKING_URI" --run-name fsdp-ddp-cpu
      - name: W&B offline FSDP/DDP run + offline-dir assert
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: ${{ github.workspace }}
          VULCAN_TRACKER_BACKEND: wandb
          VULCAN_TRACKER_RUN_NAME: fsdp-ddp-cpu-wandb
          WANDB_MODE: offline
          WANDB_DIR: ${{ github.workspace }}/wandb-runs
          WANDB_API_KEY: ""
        run: |
          . training/fsdp-ddp/.venv/bin/activate
          python training/fsdp-ddp/train.py --strategy ddp --output-dir training/results/fsdp-ddp-wandb
          python training/common/verify_tracking.py --backend wandb --wandb-dir "$WANDB_DIR"
      - name: Tracking unit tests
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: ${{ github.workspace }}
          WANDB_MODE: offline
        run: |
          . training/fsdp-ddp/.venv/bin/activate
          pytest -q training/common/tests/test_tracking.py
      - name: Tear down MLflow
        if: always()
        run: docker compose --profile training stop mlflow || true

