    name: Advisor · LangGraph tool-grounded non-fabrication
    needs: changes
    if: needs.changes.outputs.advisor_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
