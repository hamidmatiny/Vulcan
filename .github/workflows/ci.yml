# Vulcan CI — lint, unit tests, serving backends conformance + short CPU k6 (ADR-002: no GPUs).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_MIN: "65"
  VULCAN_RUNTIME_MODE: cpu
  # Byte-reproducible ONNX export (models/scripts/export_vision.py); must be set before the interpreter starts.
  PYTHONHASHSEED: "0"
  VULCAN_BENTOML_PORT: "9000"
  VULCAN_RAY_SERVE_PORT: "9002"
  VULCAN_TRITON_PORT: "9003"
  VULCAN_VLLM_PORT: "9004"
  VULCAN_GATEWAY_PORT: "9007"
  VULCAN_PROMETHEUS_PORT: "9008"
  VULCAN_GRAFANA_PORT: "9009"
  VULCAN_TEMPO_PORT: "9010"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bentoml_gate: ${{ steps.filter.outputs.bentoml_gate }}
      ray_serve_gate: ${{ steps.filter.outputs.ray_serve_gate }}
      triton_gate: ${{ steps.filter.outputs.triton_gate }}
      vllm_gate: ${{ steps.filter.outputs.vllm_gate }}
      kserve_gate: ${{ steps.filter.outputs.kserve_gate }}
      gpu_infra_gate: ${{ steps.filter.outputs.gpu_infra_gate }}
      autoscaling_gate: ${{ steps.filter.outputs.autoscaling_gate }}
      sagemaker_gate: ${{ steps.filter.outputs.sagemaker_gate }}
      bedrock_gate: ${{ steps.filter.outputs.bedrock_gate }}
      kubeflow_gate: ${{ steps.filter.outputs.kubeflow_gate }}
      gateway_gate: ${{ steps.filter.outputs.gateway_gate }}
      observability_gate: ${{ steps.filter.outputs.observability_gate }}
      advanced_gpu_gate: ${{ steps.filter.outputs.advanced_gpu_gate }}
      security_gate: ${{ steps.filter.outputs.security_gate }}
      docs_gate: ${{ steps.filter.outputs.docs_gate }}
      ray_train_gate: ${{ steps.filter.outputs.ray_train_gate }}
      fsdp_ddp_gate: ${{ steps.filter.outputs.fsdp_ddp_gate }}
      deepspeed_gate: ${{ steps.filter.outputs.deepspeed_gate }}
      lora_peft_gate: ${{ steps.filter.outputs.lora_peft_gate }}
      dvc_gate: ${{ steps.filter.outputs.dvc_gate }}
      tracking_gate: ${{ steps.filter.outputs.tracking_gate }}
      advisor_gate: ${{ steps.filter.outputs.advisor_gate }}
      force_all: ${{ steps.filter.outputs.force_all }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            force_all:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'docker-compose.yml'
              - 'training/**'
              - 'contracts/training-job-contract/**'
              - 'dvc.yaml'
              - 'dvc.lock'
            security_gate:
              - '**/Dockerfile*'
              - 'gateway/**'
              - 'observability/cost-exporter/**'
              - 'serving/bentoml/**'
              - 'serving/ray-serve/**'
              - 'serving/triton/**'
              - 'serving/vllm/**'
              - '.github/scripts/scan-image.sh'
            docs_gate:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'ARCHITECTURE.md'
              - 'CONTRIBUTING.md'
              - 'CHANGELOG.md'
              - '**/README.md'
            gpu_infra_gate:
              - 'gpu-infra/**'
              - 'infra/terraform/**'
              - 'docs/adr/003-mig-partitioning-strategy.md'
              - 'docs/adr/004-multi-tenant-gpu-scheduling-with-kueue.md'
            autoscaling_gate:
              - 'autoscaling/**'
              - 'docs/adr/005-spot-gpu-strategy.md'
            sagemaker_gate:
              - 'pipelines/sagemaker/**'
              - 'docs/runbooks/sagemaker-manual-run.md'
            bedrock_gate:
              - 'bedrock-gateway/**'
            kubeflow_gate:
              - 'pipelines/kubeflow/**'
              - 'docs/runbooks/kubeflow-local-kind.md'
            gateway_gate:
              - 'gateway/**'
              - 'docs/adr/006-routing-policy.md'
              - 'benchmark/results/**'
              - 'bedrock-gateway/pricing-reference.json'
              - 'contracts/**'
            advanced_gpu_gate:
              - 'serving/vllm/gpu-variants/**'
              - 'serving/vllm/docs/gpu-mode.md'
              - 'serving/triton/tensorrt-llm/**'
              - 'docs/adr/007-advanced-gpu-serving-techniques-scope.md'
              - 'docs/runbooks/tensorrt-llm-build.md'
              - 'serving/scripts/validate-advanced-gpu-serving.sh'
            observability_gate:
              - 'observability/**'
              - 'gateway/internal/otel/**'
              - 'serving/common/src/vulcan_serving_common/otel.py'
              - 'docker-compose.yml'
            bentoml_gate:
              - 'serving/bentoml/**'
              - 'contracts/**'
              - 'serving/common/tests/conformance/**'
              - 'models/pins.json'
              - 'models/MANIFEST.md'
            ray_serve_gate:
              - 'serving/ray-serve/**'
              - 'contracts/**'
              - 'serving/common/tests/conformance/**'
              - 'models/pins.json'
              - 'models/MANIFEST.md'
            triton_gate:
              - 'serving/triton/**'
              - 'contracts/**'
              - 'serving/common/tests/conformance/**'
              - 'models/pins.json'
              - 'models/MANIFEST.md'
            vllm_gate:
              - 'serving/vllm/**'
              - 'contracts/**'
              - 'serving/common/tests/conformance/**'
              - 'serving/common/tests/conftest.py'
              - 'models/pins.json'
              - 'models/MANIFEST.md'
            kserve_gate:
              - 'serving/kserve/**'
              - 'docs/runbooks/kserve-local-kind.md'
            ray_train_gate:
              - 'training/ray-train/**'
              - 'training/common/**'
              - 'contracts/training-job-contract/**'
              - 'docs/adr/009-gpu-cost-safety-extends-to-training.md'
              - 'docs/adr/010-unified-training-job-contract.md'
            fsdp_ddp_gate:
              - 'training/fsdp-ddp/**'
              - 'training/common/**'
              - 'contracts/training-job-contract/**'
              - 'docs/adr/009-gpu-cost-safety-extends-to-training.md'
              - 'docs/adr/010-unified-training-job-contract.md'
            deepspeed_gate:
              - 'training/deepspeed/**'
              - 'training/common/**'
              - 'contracts/training-job-contract/**'
              - 'docs/adr/009-gpu-cost-safety-extends-to-training.md'
              - 'docs/adr/010-unified-training-job-contract.md'
              - 'docs/runbooks/deepspeed-gpu-mode.md'
            lora_peft_gate:
              - 'training/fsdp-ddp/lora/**'
              - 'contracts/training-job-contract/schemas/lora-*'
              - 'contracts/training-job-contract/examples/lora-*'
              - 'serving/bentoml/models_runtime.py'
              - 'serving/bentoml/service.py'
              - 'serving/bentoml/resource-requirements-lora-demo.json'
              - 'serving/bentoml/tests/test_lora_logits_delta.py'
              - 'docs/adr/011-lora-peft-adapter-serving-integration.md'
            dvc_gate:
              - 'dvc.yaml'
              - 'dvc.lock'
              - '.dvc/**'
              - 'models/scripts/*dvc*'
              - 'models/scripts/export_llm.py'
              - 'models/scripts/export_vision.py'
              - 'models/scripts/verify_manifest.py'
              - 'models/pins.json'
              - 'models/MANIFEST.md'
              - 'docs/adr/012-data-versioning-with-dvc.md'
              - 'docs/runbooks/dvc-remote.md'
            tracking_gate:
              - 'training/common/tracking.py'
              - 'training/common/verify_tracking.py'
              - 'training/common/requirements-tracking.txt'
              - 'training/common/tests/test_tracking.py'
              - 'training/common/Dockerfile.mlflow'
              - 'training/fsdp-ddp/train.py'
              - 'training/fsdp-ddp/lora/train_lora.py'
              - 'docs/adr/013-pluggable-experiment-tracking.md'
              - 'docker-compose.yml'
            advisor_gate:
              - 'advisor/**'
              - 'docs/adr/014-langgraph-advisor-non-fabrication-scope.md'
              - 'docs/runbooks/advisor-hosted-llm.md'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install packages
        run: |
          python -m pip install -U pip
          python -m venv contracts/model-contract/.venv
          contracts/model-contract/.venv/bin/pip install -e "contracts/model-contract[dev]"
          python -m venv serving/common/.venv
          serving/common/.venv/bin/pip install -e "contracts/model-contract[dev]"
          serving/common/.venv/bin/pip install -e "serving/common[dev]"
      - name: Ruff
        run: |
          contracts/model-contract/.venv/bin/ruff check contracts/model-contract/src contracts/model-contract/tests
          serving/common/.venv/bin/ruff check serving/common/src serving/common/tests
      - name: Required ADRs + model pins
        run: |
          test -f docs/adr/001-unified-model-serving-contract.md
          test -f docs/adr/002-gpu-cost-safety-policy.md
          test -f docs/adr/003-mig-partitioning-strategy.md
          test -f docs/adr/004-multi-tenant-gpu-scheduling-with-kueue.md
          test -f docs/adr/005-spot-gpu-strategy.md
          test -f docs/adr/006-routing-policy.md
          test -f docs/adr/007-advanced-gpu-serving-techniques-scope.md
          test -f docs/adr/008-self-hosted-cost-per-token-assumptions.md
          test -f docs/adr/009-gpu-cost-safety-extends-to-training.md
          test -f docs/adr/010-unified-training-job-contract.md
          test -f docs/adr/011-lora-peft-adapter-serving-integration.md
          test -f docs/adr/012-data-versioning-with-dvc.md
          test -f docs/adr/013-pluggable-experiment-tracking.md
          test -f docs/adr/014-langgraph-advisor-non-fabrication-scope.md
          test -f docs/runbooks/advisor-hosted-llm.md
          test -f advisor/graph.py
          test -f advisor/non_fabrication.py
          test -f advisor/verify_live.py
          test -f models/MANIFEST.md
          test -f models/pins.json
          test -f dvc.yaml
          test -f dvc.lock
          test -f models/scripts/verify_dvc_manifest.py
          test -f docs/runbooks/dvc-remote.md
          test -f training/common/tracking.py
          test -f training/common/verify_tracking.py
          test -f training/common/Dockerfile.mlflow
          test -f contracts/training-job-contract/openapi.yaml
          test -f contracts/training-job-contract/schemas/lora-fine-tune-spec.schema.json
          test -f training/ray-train/train.py
          test -f training/fsdp-ddp/train.py
          test -f training/fsdp-ddp/lora/train_lora.py
          test -f training/deepspeed/train.py
          test -f serving/bentoml/resource-requirements-lora-demo.json
          test -f docs/runbooks/deepspeed-gpu-mode.md
      - name: Port convention (9000–9099)
        run: |
          grep -qE '9000[–-]9099' docker-compose.yml
          grep -qE '9000[–-]9099' .cursor/rules/vulcan-foundations.mdc
          grep -q 'VULCAN_BENTOML_PORT:-9000' docker-compose.yml
          grep -q 'VULCAN_REFERENCE_PORT:-9001' docker-compose.yml
          grep -q 'VULCAN_RAY_SERVE_PORT:-9002' docker-compose.yml
          grep -q 'VULCAN_TRITON_PORT:-9003' docker-compose.yml
          grep -q 'VULCAN_VLLM_PORT:-9004' docker-compose.yml
          grep -q 'VULCAN_GATEWAY_PORT:-9007' docker-compose.yml
          grep -q 'VULCAN_PROMETHEUS_PORT:-9008' docker-compose.yml
          grep -q 'VULCAN_GRAFANA_PORT:-9009' docker-compose.yml
          grep -q 'VULCAN_TEMPO_PORT:-9010' docker-compose.yml
          grep -q 'VULCAN_RAY_TRAIN_PORT:-9011' docker-compose.yml
          grep -q 'VULCAN_FSDP_DDP_PORT:-9012' docker-compose.yml
          grep -q 'VULCAN_DEEPSPEED_PORT:-9013' docker-compose.yml
          grep -q 'VULCAN_MLFLOW_PORT:-9014' docker-compose.yml
          grep -q '9002' .cursor/rules/vulcan-foundations.mdc
          grep -q '9003' .cursor/rules/vulcan-foundations.mdc
          grep -q '9004' .cursor/rules/vulcan-foundations.mdc
          grep -q '9005' .cursor/rules/vulcan-foundations.mdc
          grep -q '9006' .cursor/rules/vulcan-foundations.mdc
          grep -q '9007' .cursor/rules/vulcan-foundations.mdc
          grep -q '9008' .cursor/rules/vulcan-foundations.mdc
          grep -q '9009' .cursor/rules/vulcan-foundations.mdc
          grep -q '9010' .cursor/rules/vulcan-foundations.mdc
          grep -q '9011' .cursor/rules/vulcan-foundations.mdc
          grep -q '9012' .cursor/rules/vulcan-foundations.mdc
          grep -q '9013' .cursor/rules/vulcan-foundations.mdc
          grep -q '9014' .cursor/rules/vulcan-foundations.mdc
          grep -qE 'phase-N:|fix\(<component>\)' .cursor/rules/vulcan-foundations.mdc
          test -f serving/kserve/helm/Chart.yaml
          test -f docs/runbooks/kserve-local-kind.md
          test -f observability/prometheus/prometheus.yml
          test -f observability/grafana/dashboards/vulcan-serving.json
          test -f serving/vllm/gpu-variants/gptq/resource-requirements.json
          test -f serving/triton/tensorrt-llm/model_repository/reference_tiny_llm_trtllm/config.pbtxt
          test -f docs/runbooks/tensorrt-llm-build.md

  unit-tests:
    name: Unit tests · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install + test model-contract (coverage ≥65%)
        run: |
          python -m pip install -U pip
          python -m venv contracts/model-contract/.venv
          . contracts/model-contract/.venv/bin/activate
          pip install -e "contracts/model-contract[dev]"
          cd contracts/model-contract
          pytest -q \
            --cov=vulcan_model_contract \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_MIN }}
      - name: Install + test training-job-contract (coverage ≥65%)
        run: |
          python -m pip install -U pip
          python -m venv contracts/training-job-contract/.venv
          . contracts/training-job-contract/.venv/bin/activate
          pip install -e "contracts/training-job-contract[dev]"
          cd contracts/training-job-contract
          pytest -q \
            --cov=vulcan_training_contract \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_MIN }}

  serving-common:
    name: Unit tests · serving/common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install + test (coverage ≥65%)
        run: |
          python -m pip install -U pip
          python -m venv serving/common/.venv
          . serving/common/.venv/bin/activate
          pip install -e "contracts/model-contract[dev]"
          pip install -e "serving/common[dev]"
          cd serving/common
          pytest -q \
            --cov=vulcan_serving_common \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_MIN }}
      - name: Benchmark compare-script tests
        run: |
          . serving/common/.venv/bin/activate
          PYTHONPATH=benchmark/scripts pytest -q benchmark/tests

  gateway-unit:
    name: Unit tests · gateway (Go ≥65%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Go coverage gate on gateway/internal
        run: make test-gateway

  cost-exporter-unit:
    name: Unit tests · cost-exporter (≥65%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cost-exporter pytest coverage
        run: make test-cost-exporter

  semgrep:
    name: Semgrep · Python + Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Semgrep
        # setuptools provides pkg_resources; setuptools 82+ can omit it and break semgrep 1.90.
        run: python -m pip install -U pip 'setuptools<81' semgrep==1.90.0
      - name: Semgrep rulesets
        run: |
          semgrep scan --config=p/python --config=p/golang --error \
            --exclude='**/.venv/**' \
            --exclude='**/models/artifacts/**' \
            --exclude='**/site/**' \
            --exclude='**/node_modules/**' \
            serving/ gateway/ bedrock-gateway/ pipelines/ autoscaling/checkpointing/ observability/cost-exporter/ contracts/ training/

  docs:
    name: Docs · MkDocs build
    needs: changes
    if: needs.changes.outputs.docs_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: mkdocs build
        run: make docs-build

  security-images:
    name: Security · Trivy + Syft on built images
    needs: changes
    if: needs.changes.outputs.security_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated release download — avoids unauthenticated GitHub API rate limits
          # that silently kill aquasecurity/trivy contrib/install.sh on shared runners.
          # v0.56.2 is no longer published; pin a current Linux-64bit release asset.
          curl -sSfL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      - name: Install Syft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v1.14.1/syft_1.14.1_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft version
      - name: Export pinned reference models (CPU)
        run: |
          python -m pip install -U pip
          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          # --no-deps: do not smash numpy/protobuf; CPU wheel must replace any CUDA torch from requirements.
          models/.venv/bin/pip install --force-reinstall --no-deps torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          models/.venv/bin/python -c 'import torch,numpy; print("torch", torch.__version__, "numpy", numpy.__version__)'
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Prepare Triton model repository
        run: make triton-prepare
      - name: Build Vulcan images
        run: |
          docker compose build \
            bentoml ray-serve triton-engine triton vllm-engine vllm gateway cost-exporter
      - name: Trivy CRITICAL + Syft SBOM (each image)
        run: |
          chmod +x .github/scripts/scan-image.sh
          for img in \
            vulcan-bentoml:cpu \
            vulcan-ray-serve:cpu \
            vulcan-triton:cpu \
            vulcan-triton-engine:cpu \
            vulcan-vllm:cpu \
            vulcan-vllm-engine:cpu \
            vulcan-gateway:cpu \
            vulcan-cost-exporter:cpu
          do
            .github/scripts/scan-image.sh "$img" sboms
          done
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: vulcan-sboms
          path: sboms/

  bentoml:
    name: BentoML · conformance + CPU k6
    needs: changes
    if: needs.changes.outputs.bentoml_gate == 'true' || needs.changes.outputs.force_all == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export pinned reference models (CPU)
        run: |
          python -m pip install -U pip
          python -m venv models/.venv
          models/.venv/bin/pip install -r models/scripts/requirements.txt
          # --no-deps: do not smash numpy/protobuf; CPU wheel must replace any CUDA torch from requirements.
          models/.venv/bin/pip install --force-reinstall --no-deps torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          models/.venv/bin/python -c 'import torch,numpy; print("torch", torch.__version__, "numpy", numpy.__version__)'
          (cd models/scripts && ../.venv/bin/python export_llm.py)
          (cd models/scripts && ../.venv/bin/python export_vision.py)
          (cd models/scripts && ../.venv/bin/python verify_manifest.py)
      - name: Build + start bentoml (compose :9000)
        run: |
          docker compose build bentoml
          docker compose up -d bentoml
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${VULCAN_BENTOML_PORT}/health" | grep -q '"status":"ok"'; then
              echo "bentoml ready"
              curl -fsS "http://127.0.0.1:${VULCAN_BENTOML_PORT}/health"
              exit 0
            fi
            echo "waiting ($i)..."
            sleep 5
          done
          docker compose logs bentoml | tail -200
          exit 1
      - name: Contract conformance suite
        run: |
          python -m venv serving/common/.venv
          . serving/common/.venv/bin/activate
          pip install -e "contracts/model-contract[dev]"
          pip install -e "serving/common[dev]"
          export VULCAN_BACKEND_URL="http://127.0.0.1:${VULCAN_BENTOML_PORT}"
          cd serving/common
          pytest -q tests/conformance
      - name: Short CPU k6 (regression, not a perf claim)
        run: |
          mkdir -p benchmark/results
          chmod a+rwX benchmark/results
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -e BASE_URL="http://127.0.0.1:${VULCAN_BENTOML_PORT}" \
            -e MODEL_TYPE=llm \
            -e MODEL_ID=reference-tiny-llm \
            -e VUS=2 \
            -e DURATION=10s \
            -e BACKEND_NAME=bentoml \
            -e RESULTS_OUT=benchmark/results/bentoml-cpu.json \
