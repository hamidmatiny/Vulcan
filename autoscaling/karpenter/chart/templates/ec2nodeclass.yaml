apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: vulcan-gpu
  labels:
    app.kubernetes.io/part-of: vulcan
    vulcan.dev/component: karpenter
spec:
  amiFamily: {{ .Values.amiFamily }}
  role: {{ .Values.role | quote }}
  subnetSelectorTerms:
    {{- toYaml .Values.subnetSelectorTerms | nindent 4 }}
  securityGroupSelectorTerms:
    {{- toYaml .Values.securityGroupSelectorTerms | nindent 4 }}
  # GPU AMI path aligns with phase-7 AL2_x86_64_GPU / Operator driver.enabled=false.
  tags:
    vulcan.dev/cluster: {{ .Values.clusterName | quote }}
    vulcan.dev/component: karpenter-gpu
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
