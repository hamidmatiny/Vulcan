[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-bedrock"
version = "0.11.0"
description = "Thin Bedrock adapter exposing Vulcan LLM-branch contract (phase-11)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "boto3>=1.34",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "moto>=5.0",
  "ruff>=0.5",
]

[project.scripts]
vulcan-bedrock-gateway = "vulcan_bedrock.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulcan_bedrock = ["../pricing-reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["vulcan_bedrock"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
