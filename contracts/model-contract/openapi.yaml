openapi: 3.1.0
info:
  title: Vulcan Model Serving Contract
  version: 0.1.0
  summary: Backend-agnostic HTTP contract for every Vulcan serving backend.
  description: |
    Single serving surface implemented by BentoML, Ray Serve, Triton, vLLM, KServe,
    and any future backend. See ADR-001 for the decision record.

    Every backend MUST expose `/health`, `/metrics`, and `/v1/infer` exactly as
    specified here, and MUST publish a resource-requirements manifest conforming
    to `schemas/resource-requirements.schema.json`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Vulcan maintainers

servers:
  - url: http://localhost:9000
    description: Local CPU-dev default — serving/bentoml (Vulcan ports 9000–9099)

tags:
  - name: health
    description: Liveness / readiness
  - name: metrics
    description: Prometheus exposition
  - name: inference
    description: Unified inference API
  - name: resources
    description: Declared GPU / runtime resource requirements

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and readiness probe
      description: |
        Returns process health. When dependencies (model weights, tokenizer) are
        not yet loaded, `status` MUST be `starting` and HTTP status SHOULD be 503.
        Once ready to serve `/v1/infer`, `status` MUST be `ok` with HTTP 200.
      responses:
        "200":
          description: Backend is ready to serve inference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ready:
                  value:
                    status: ok
                    backend: vllm
                    model_id: reference-tiny-llm
                    version: 0.1.0
                    mode: cpu
        "503":
          description: Backend is starting or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                starting:
                  value:
                    status: starting
                    backend: triton
                    model_id: reference-tiny-llm
                    version: 0.1.0
                    mode: cpu

  /metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Prometheus metrics exposition
      description: |
        MUST return Prometheus text exposition format
        (`text/plain; version=0.0.4` or OpenMetrics). At minimum backends SHOULD
        emit request count, latency histograms, and in-flight gauges for `/v1/infer`.
      responses:
        "200":
          description: Prometheus metrics body.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format.
              examples:
                sample:
                  value: |
                    # HELP vulcan_infer_requests_total Total /v1/infer requests
                    # TYPE vulcan_infer_requests_total counter
                    vulcan_infer_requests_total{backend="vllm",status="ok"} 42
                    # HELP vulcan_infer_latency_seconds Inference latency
                    # TYPE vulcan_infer_latency_seconds histogram
                    vulcan_infer_latency_seconds_bucket{le="0.1"} 10
                    vulcan_infer_latency_seconds_bucket{le="+Inf"} 42
                    vulcan_infer_latency_seconds_sum 3.14
                    vulcan_infer_latency_seconds_count 42

  /v1/infer:
    post:
      tags: [inference]
      operationId: infer
      summary: Backend-agnostic inference
      description: |
        Discriminated-union request body. The `modality` field selects LLM-style
        or vision-style payloads. Response mirrors the request modality.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferRequest"
            examples:
              llm:
                summary: LLM completion
                value:
                  request_id: req-01HZX9K2
                  modality: llm
                  model_id: reference-tiny-llm
                  input:
                    messages:
                      - role: user
                        content: "Say hello in one word."
                    max_tokens: 16
                    temperature: 0.0
              vision:
                summary: Vision classify / describe
                value:
                  request_id: req-01HZX9K3
                  modality: vision
                  model_id: reference-tiny-vision
                  input:
                    images:
                      - media_type: image/png
                        data_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
                    prompt: "What is in this image?"
                    max_tokens: 32
      responses:
        "200":
          description: Successful inference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferResponse"
              examples:
                llm:
                  value:
                    request_id: req-01HZX9K2
                    modality: llm
                    model_id: reference-tiny-llm
                    output:
                      text: "Hello"
                      finish_reason: stop
                      usage:
                        prompt_tokens: 8
                        completion_tokens: 1
                        total_tokens: 9
                    latency_ms: 12.4
                vision:
                  value:
                    request_id: req-01HZX9K3
                    modality: vision
                    model_id: reference-tiny-vision
                    output:
                      text: "A red square"
                      labels:
                        - name: square
                          score: 0.91
                      finish_reason: stop
                      usage:
                        prompt_tokens: 20
                        completion_tokens: 4
                        total_tokens: 24
                    latency_ms: 45.0
        "400":
          description: Invalid request (schema or modality mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Backend not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/resources:
    get:
      tags: [resources]
      operationId: getResourceRequirements
      summary: Declared resource-requirements manifest
      description: |
        Runtime view of the resource-requirements manifest. The same schema is
        also published as a static file (`resource-requirements.json`) alongside
        each backend for packaging / scheduling.
      responses:
        "200":
          description: Resource requirements for the loaded model/backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRequirements"
              examples:
                tiny_cpu:
                  value:
                    model_id: reference-tiny-llm
                    backend: vllm
                    gpu_memory_mib:
                      min: 0
                      max: 0
                    supports_mig: false
                    supports_quantization: true
                    cold_start_seconds:
                      min: 1
                      max: 5
                    cpu_dev_mode: true
                    notes: "CPU-only reference model for local and CI."

components:
  schemas:
    HealthStatus:
      type: string
      enum: [ok, starting, error]

    RuntimeMode:
      type: string
      enum: [cpu, gpu]
      description: |
        `cpu` is mandatory for local/CI (ADR-002). `gpu` is used only outside CI
        on manually provisioned hardware.

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, backend, model_id, version, mode]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        backend:
          type: string
          description: Backend identifier (bentoml, ray-serve, triton, vllm, kserve, ...).
          minLength: 1
        model_id:
          type: string
          minLength: 1
        version:
          type: string
          description: Backend or model package version.
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        detail:
          type: string
          description: Optional human-readable status detail.

    Modality:
      type: string
      enum: [llm, vision]

    ChatRole:
      type: string
      enum: [system, user, assistant]

    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string

    LlmInput:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        max_tokens:
          type: integer
          minimum: 1
          default: 256
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        stop:
          type: array
          items:
            type: string

    ImageMediaType:
      type: string
      enum: [image/png, image/jpeg, image/webp]

    VisionImage:
      type: object
      additionalProperties: false
      required: [media_type, data_base64]
      properties:
        media_type:
          $ref: "#/components/schemas/ImageMediaType"
        data_base64:
          type: string
          description: Base64-encoded image bytes (no data-URI prefix).
          minLength: 1
        url:
          type: string
          format: uri
          description: Optional fetch URL; when present, backends MAY ignore data_base64.

    VisionInput:
      type: object
      additionalProperties: false
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VisionImage"
        prompt:
          type: string
          description: Optional text prompt / question about the image(s).
        max_tokens:
          type: integer
          minimum: 1
          default: 256

    InferRequestLlm:
      type: object
      additionalProperties: false
      required: [request_id, modality, model_id, input]
      properties:
        request_id:
          type: string
          minLength: 1
        modality:
          type: string
          const: llm
        model_id:
          type: string
          minLength: 1
        input:
          $ref: "#/components/schemas/LlmInput"
        metadata:
          type: object
          additionalProperties:
            type: string

    InferRequestVision:
      type: object
      additionalProperties: false
      required: [request_id, modality, model_id, input]
      properties:
        request_id:
          type: string
          minLength: 1
        modality:
          type: string
          const: vision
        model_id:
          type: string
          minLength: 1
        input:
          $ref: "#/components/schemas/VisionInput"
        metadata:
          type: object
          additionalProperties:
            type: string

    InferRequest:
      description: Discriminated union on `modality`.
      oneOf:
        - $ref: "#/components/schemas/InferRequestLlm"
        - $ref: "#/components/schemas/InferRequestVision"
      discriminator:
        propertyName: modality
        mapping:
          llm: "#/components/schemas/InferRequestLlm"
          vision: "#/components/schemas/InferRequestVision"

    TokenUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    FinishReason:
      type: string
      enum: [stop, length, error, content_filter]

    LabelScore:
      type: object
      additionalProperties: false
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1

    LlmOutput:
      type: object
      additionalProperties: false
      required: [text, finish_reason]
      properties:
        text:
          type: string
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        usage:
          $ref: "#/components/schemas/TokenUsage"

    VisionOutput:
      type: object
      additionalProperties: false
      required: [finish_reason]
      properties:
        text:
          type: string
          description: Free-form caption / answer when applicable.
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelScore"
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        usage:
          $ref: "#/components/schemas/TokenUsage"

    InferResponseLlm:
      type: object
      additionalProperties: false
      required: [request_id, modality, model_id, output, latency_ms]
      properties:
        request_id:
          type: string
        modality:
          type: string
          const: llm
        model_id:
          type: string
        output:
          $ref: "#/components/schemas/LlmOutput"
        latency_ms:
          type: number
          minimum: 0

    InferResponseVision:
      type: object
      additionalProperties: false
      required: [request_id, modality, model_id, output, latency_ms]
      properties:
        request_id:
          type: string
        modality:
          type: string
          const: vision
        model_id:
          type: string
        output:
          $ref: "#/components/schemas/VisionOutput"
        latency_ms:
          type: number
          minimum: 0

    InferResponse:
      description: Discriminated union on `modality`.
      oneOf:
        - $ref: "#/components/schemas/InferResponseLlm"
        - $ref: "#/components/schemas/InferResponseVision"
      discriminator:
        propertyName: modality
        mapping:
          llm: "#/components/schemas/InferResponseLlm"
          vision: "#/components/schemas/InferResponseVision"

    MemoryRangeMiB:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 0
          description: Minimum GPU memory required (MiB). 0 means CPU-capable.
        max:
          type: integer
          minimum: 0
          description: Maximum GPU memory the backend will use (MiB).
      description: min MUST be ≤ max.

    ColdStartRangeSeconds:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: number
          minimum: 0
        max:
          type: number
          minimum: 0
      description: Expected cold-start window in seconds (min ≤ max).

    ResourceRequirements:
      type: object
      additionalProperties: false
      required:
        - model_id
        - backend
        - gpu_memory_mib
        - supports_mig
        - supports_quantization
        - cold_start_seconds
        - cpu_dev_mode
      properties:
        model_id:
          type: string
          minLength: 1
        backend:
          type: string
          minLength: 1
        gpu_memory_mib:
          $ref: "#/components/schemas/MemoryRangeMiB"
        supports_mig:
          type: boolean
          description: Whether the deployment can run under NVIDIA MIG partitions.
        supports_quantization:
          type: boolean
          description: Whether quantized weights (e.g. INT8/INT4/AWQ/GPTQ) are supported.
        cold_start_seconds:
          $ref: "#/components/schemas/ColdStartRangeSeconds"
        cpu_dev_mode:
          type: boolean
          description: |
            MUST be true for any artifact used in CI or local compose (ADR-002).
            GPU-only packages set this false and are never selected by automation.
        notes:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
