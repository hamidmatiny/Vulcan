# Vulcan local stack — CPU-only by policy (ADR-002).
#
# Host port allocation: 9000–9099 ONLY (avoid Argus / other sibling stacks).
#   9000 — serving/bentoml
#   9001 — serving/common reference server (optional profile: reference)
#   9002 — serving/ray-serve
#   9003 — serving/triton (contract shim; engine is internal-only)
#   9004 — serving/vllm (contract shim; OpenAI-compatible engine internal)
#   9099 — contract OpenAPI stub (optional profile: stub)
#   9005 — optional KServe port-forward (no compose service)
#   9006 — bedrock-gateway optional local shim (no compose; moto in CI)
#   9007 — gateway (routing; ADR-006)
#   9008–9098 — reserved for later backends / observability

name: vulcan

services:
  bentoml:
    build:
      context: .
      dockerfile: serving/bentoml/Dockerfile
    image: vulcan-bentoml:cpu
    ports:
      - "${VULCAN_BENTOML_PORT:-9000}:9000"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    restart: unless-stopped

  ray-serve:
    build:
      context: .
      dockerfile: serving/ray-serve/Dockerfile
    image: vulcan-ray-serve:cpu
    ports:
      - "${VULCAN_RAY_SERVE_PORT:-9002}:9002"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
      PORT: "9002"
      HOST: "0.0.0.0"
      RAY_NUM_CPUS: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 240s
    restart: unless-stopped

  # Triton Inference Server (ONNX Runtime, KIND_CPU). No host ports — shim only.
  # Requires `make triton-prepare` so model_repository/*/1/model.onnx exist before build.
  triton-engine:
    platform: linux/amd64
    build:
      context: .
      dockerfile: serving/triton/Dockerfile.engine
    image: vulcan-triton-engine:cpu
    environment:
      CUDA_VISIBLE_DEVICES: ""
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 240s
    restart: unless-stopped

  triton:
    build:
      context: .
      dockerfile: serving/triton/Dockerfile
    image: vulcan-triton:cpu
    ports:
      - "${VULCAN_TRITON_PORT:-9003}:9003"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
      TRITON_URL: triton-engine:8000
      TRITON_WAIT_SECONDS: "360"
      PORT: "9003"
      HOST: "0.0.0.0"
    depends_on:
      triton-engine:
        condition: service_healthy
    healthcheck:
      # Engine must already be healthy (depends_on); allow tokenizer/side-asset warm-up.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9003/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 240s
    restart: unless-stopped

  # vLLM adapter — CPU OpenAI-compatible engine (small-model path). LLM-only.
  vllm-engine:
    build:
      context: .
      dockerfile: serving/vllm/Dockerfile.engine
    image: vulcan-vllm-engine:cpu
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODEL_DIR: /models/llm/gpt2-small
      PORT: "8000"
      HOST: "0.0.0.0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s
    restart: unless-stopped

  vllm:
    build:
      context: .
      dockerfile: serving/vllm/Dockerfile
    image: vulcan-vllm:cpu
    ports:
      - "${VULCAN_VLLM_PORT:-9004}:9004"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VLLM_URL: http://vllm-engine:8000
      VLLM_WAIT_SECONDS: "300"
      PORT: "9004"
      HOST: "0.0.0.0"
    depends_on:
      vllm-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9004/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 120s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: vulcan-gateway:cpu
    ports:
      - "${VULCAN_GATEWAY_PORT:-9007}:9007"
    environment:
      PORT: "9007"
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_RESOURCES_PATH: /app/resource-requirements.json
      VULCAN_BENCHMARK_DIR: /benchmarks
      VULCAN_BEDROCK_PRICING: /pricing/pricing-reference.json
      VULCAN_BENTOML_URL: http://bentoml:9000
      VULCAN_RAY_SERVE_URL: http://ray-serve:9002
      VULCAN_TRITON_URL: http://triton:9003
      VULCAN_VLLM_URL: http://vllm:9004
      # kserve/sagemaker/bedrock URLs intentionally empty in local compose (see gateway/README)
    volumes:
      - ./benchmark/results:/benchmarks:ro
      - ./bedrock-gateway/pricing-reference.json:/pricing/pricing-reference.json:ro
    depends_on:
      bentoml:
        condition: service_healthy
      ray-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9007/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # Phase-1 trivial reference server (no real weights) — optional.
  reference:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: serving/common/Dockerfile.reference
    image: vulcan-reference:cpu
    ports:
      - "${VULCAN_REFERENCE_PORT:-9001}:9001"
    environment:
      VULCAN_RUNTIME_MODE: cpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  contract-stub:
    profiles: ["stub"]
    image: nginx:1.27-alpine
    ports:
      - "${VULCAN_STUB_PORT:-9099}:80"
    volumes:
      - ./contracts/model-contract/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
