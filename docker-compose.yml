# Vulcan local stack — CPU-only by policy (ADR-002).
#
# Host port allocation: 9000–9099 ONLY (avoid Argus / other sibling stacks).
#   9000 — serving/bentoml
#   9001 — serving/common reference server (optional profile: reference)
#   9002 — serving/ray-serve
#   9003 — serving/triton (contract shim; engine is internal-only)
#   9004 — serving/vllm (contract shim; OpenAI-compatible engine internal)
#   9099 — contract OpenAPI stub (optional profile: stub)
#   9005 — optional KServe port-forward (no compose service)
#   9006 — bedrock-gateway optional local shim (no compose; moto in CI)
#   9007 — gateway (routing; ADR-006)
#   9008 — prometheus
#   9009 — grafana
#   9010 — tempo (trace query; OTLP stays on docker network)
#   9011–9098 — reserved

name: vulcan

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_SAMPLER: parentbased_always_on

services:
  bentoml:
    build:
      context: .
      dockerfile: serving/bentoml/Dockerfile
    image: vulcan-bentoml:cpu
    ports:
      - "${VULCAN_BENTOML_PORT:-9000}:9000"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
      <<: *otel-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    restart: unless-stopped

  ray-serve:
    build:
      context: .
      dockerfile: serving/ray-serve/Dockerfile
    image: vulcan-ray-serve:cpu
    ports:
      - "${VULCAN_RAY_SERVE_PORT:-9002}:9002"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
      PORT: "9002"
      HOST: "0.0.0.0"
      RAY_NUM_CPUS: "2"
      <<: *otel-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 240s
    restart: unless-stopped

  # Triton Inference Server (ONNX Runtime, KIND_CPU). No host ports — shim only.
  # Requires `make triton-prepare` so model_repository/*/1/model.onnx exist before build.
  triton-engine:
    platform: linux/amd64
    build:
      context: .
      dockerfile: serving/triton/Dockerfile.engine
    image: vulcan-triton-engine:cpu
    environment:
      CUDA_VISIBLE_DEVICES: ""
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 240s
    restart: unless-stopped

  triton:
    build:
      context: .
      dockerfile: serving/triton/Dockerfile
    image: vulcan-triton:cpu
    ports:
      - "${VULCAN_TRITON_PORT:-9003}:9003"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODELS_DIR: /models
      TRITON_URL: triton-engine:8000
      TRITON_WAIT_SECONDS: "360"
      PORT: "9003"
      HOST: "0.0.0.0"
      <<: *otel-env
    depends_on:
      triton-engine:
        condition: service_healthy
    healthcheck:
      # Engine must already be healthy (depends_on); allow tokenizer/side-asset warm-up.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9003/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 240s
    restart: unless-stopped

  # vLLM adapter — CPU OpenAI-compatible engine (small-model path). LLM-only.
  vllm-engine:
    build:
      context: .
      dockerfile: serving/vllm/Dockerfile.engine
    image: vulcan-vllm-engine:cpu
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_MODEL_DIR: /models/llm/gpt2-small
      PORT: "8000"
      HOST: "0.0.0.0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s
    restart: unless-stopped

  vllm:
    build:
      context: .
      dockerfile: serving/vllm/Dockerfile
    image: vulcan-vllm:cpu
    ports:
      - "${VULCAN_VLLM_PORT:-9004}:9004"
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VLLM_URL: http://vllm-engine:8000
      VLLM_WAIT_SECONDS: "300"
      PORT: "9004"
      HOST: "0.0.0.0"
      <<: *otel-env
    depends_on:
      vllm-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9004/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 120s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: vulcan-gateway:cpu
    ports:
      - "${VULCAN_GATEWAY_PORT:-9007}:9007"
    environment:
      PORT: "9007"
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_RESOURCES_PATH: /app/resource-requirements.json
      VULCAN_BENCHMARK_DIR: /benchmarks
      VULCAN_BEDROCK_PRICING: /pricing/pricing-reference.json
      VULCAN_BENTOML_URL: http://bentoml:9000
      VULCAN_RAY_SERVE_URL: http://ray-serve:9002
      VULCAN_TRITON_URL: http://triton:9003
      VULCAN_VLLM_URL: http://vllm:9004
      # kserve/sagemaker/bedrock URLs intentionally empty in local compose (see gateway/README)
      <<: *otel-env
    volumes:
      - ./benchmark/results:/benchmarks:ro
      - ./bedrock-gateway/pricing-reference.json:/pricing/pricing-reference.json:ro
    depends_on:
      bentoml:
        condition: service_healthy
      ray-serve:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9007/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # --- Observability (phase-14): Prometheus :9008 · Grafana :9009 · Tempo :9010 ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${VULCAN_TEMPO_PORT:-9010}:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${VULCAN_PROMETHEUS_PORT:-9008}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - blackbox
      - cost-exporter
      - synthetic-dcgm
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  cost-exporter:
    build:
      context: .
      dockerfile: observability/cost-exporter/Dockerfile
    image: vulcan-cost-exporter:cpu
    environment:
      VULCAN_RUNTIME_MODE: cpu
      VULCAN_BENCHMARK_DIR: /benchmarks
      VULCAN_BEDROCK_PRICING: /pricing/pricing-reference.json
      VULCAN_GPU_HOUR_ASSUMPTIONS: /app/gpu-hour-assumptions.json
      PORT: "9100"
    volumes:
      - ./benchmark/results:/benchmarks:ro
      - ./bedrock-gateway/pricing-reference.json:/pricing/pricing-reference.json:ro
    restart: unless-stopped

  synthetic-dcgm:
    build:
      context: .
      dockerfile: observability/gpu-metrics/synthetic-dcgm/Dockerfile
    image: vulcan-synthetic-dcgm:cpu
    environment:
      PORT: "9400"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${VULCAN_GRAFANA_PORT:-9009}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  # Phase-1 trivial reference server (no real weights) — optional.
  reference:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: serving/common/Dockerfile.reference
    image: vulcan-reference:cpu
    ports:
      - "${VULCAN_REFERENCE_PORT:-9001}:9001"
    environment:
      VULCAN_RUNTIME_MODE: cpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  contract-stub:
    profiles: ["stub"]
    image: nginx:1.27-alpine
    ports:
      - "${VULCAN_STUB_PORT:-9099}:80"
    volumes:
      - ./contracts/model-contract/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
