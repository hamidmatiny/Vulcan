[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-cost-exporter"
version = "0.14.0"
description = "Prometheus exporter for Vulcan routing cost/latency catalog data"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
py-modules = ["exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["exporter"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true
