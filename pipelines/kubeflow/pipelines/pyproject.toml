[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-kfp"
version = "0.12.0"
description = "Kubeflow Pipelines definition for reference-tiny-llm train→eval→KServe handoff"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "kfp>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
vulcan-kfp-compile = "vulcan_kfp.compile_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulcan_kfp = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["vulcan_kfp"]
branch = true
# KFP component bodies execute inside containers; compile + conftest cover the graph.
omit = ["*/compile_pipeline.py", "*/pipeline.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
