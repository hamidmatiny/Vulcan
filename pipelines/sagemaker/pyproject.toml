[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-sagemaker"
version = "0.10.0"
description = "SageMaker Pipelines / Model Registry / Endpoints for Vulcan reference-tiny-llm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "boto3>=1.34",
  "sagemaker>=2.220,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "moto[sagemaker,s3,iam,sts]>=5.0",
  "ruff>=0.5",
]

[project.scripts]
vulcan-sm-upsert-pipeline = "vulcan_sagemaker.cli:upsert_pipeline_main"
vulcan-sm-deploy = "vulcan_sagemaker.cli:deploy_main"
vulcan-sm-invoke = "vulcan_sagemaker.cli:invoke_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulcan_sagemaker = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["vulcan_sagemaker"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
