{{- if .Values.triton.enabled }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.triton.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vulcan-kserve.labels" . | nindent 4 }}
    vulcan.dev/backend: triton
    vulcan.dev/modalities: "llm,vision"
  annotations:
    {{- include "vulcan-kserve.annotations" . | nindent 4 }}
    {{- if .Values.triton.canary.enabled }}
    serving.kserve.io/enable-tag-routing: "true"
    {{- end }}
spec:
  predictor:
    minReplicas: {{ .Values.autoscaling.minReplicas }}
    maxReplicas: {{ .Values.autoscaling.maxReplicas }}
    {{- if .Values.triton.canary.enabled }}
    canaryTrafficPercent: {{ .Values.triton.canary.trafficPercent }}
    {{- end }}
    containers:
      - name: kserve-container
        image: {{ if .Values.triton.canary.enabled }}{{ .Values.triton.shim.imageCanary }}{{ else }}{{ .Values.triton.shim.image }}{{ end }}
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.triton.shim.port }}
            protocol: TCP
        env:
          - name: PORT
            value: {{ .Values.triton.shim.port | quote }}
          - name: HOST
            value: "0.0.0.0"
          - name: VULCAN_RUNTIME_MODE
            value: "cpu"
          - name: TRITON_URL
            value: "127.0.0.1:8000"
          - name: TRITON_WAIT_SECONDS
            value: "360"
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.triton.shim.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.triton.shim.port }}
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          {{- toYaml .Values.triton.resources | nindent 10 }}
      - name: triton-engine
        image: {{ if .Values.triton.canary.enabled }}{{ .Values.triton.engine.imageCanary }}{{ else }}{{ .Values.triton.engine.image }}{{ end }}
        imagePullPolicy: IfNotPresent
        env:
          - name: CUDA_VISIBLE_DEVICES
            value: ""
        ports:
          - containerPort: 8000
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 6Gi
{{- end }}
